<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neyra — pitch</title>
  <meta name="description" content="Neyra live pitch: from orbit to the field. NASA Space Apps Challenge 2026, Tashkent.">
  <meta name="theme-color" content="#0b0f0d">
  <link rel="icon" type="image/png" sizes="64x64" href="../site/assets/neyra-64.png">
  <link rel="preload" as="image" href="assets/earth.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="pitch.css?v=202611151650">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
  <canvas id="globe" aria-hidden="true"></canvas>
  <div id="earthStatic" class="earth-static" hidden aria-hidden="true"></div>

  <main id="stage">
    <!-- 1 title -->
    <section class="slide s0" data-s="0">
      <div class="hero-txt">
        <img class="mark in" src="../site/assets/neyra-mark.png" alt="">
        <h1 class="in">Neyra</h1>
        <p class="tag in" data-t="tag"></p>
        <p class="sub in" data-t="sub"></p>
      </div>
      <div class="scroll-cue in" aria-hidden="true"><i></i></div>
    </section>

    <!-- 2 orbit -> field -->
    <section class="slide s1" data-s="1">
      <div id="flyMap" class="flymap"></div>
      <div class="fly-shade" id="flyShade"></div>
      <div class="fly-label" id="flyLabel"><p class="eyebrow" data-t="fly_e"></p><h2 data-t="fly_where"></h2></div>
      <p class="fly-cap" id="flyCap"><span data-t="fly_cap"></span><br><small data-t="credit_earth"></small></p>
    </section>

    <!-- 3 problem -->
    <section class="slide s2" data-s="2">
      <p class="eyebrow in" data-t="e2"></p>
      <h2 class="in" data-t="h2"></h2>
      <div class="wall" id="wall"></div>
    </section>

    <!-- 4 numbers -->
    <section class="slide s3" data-s="3">
      <p class="eyebrow in" data-t="e3"></p>
      <h2 class="in" data-t="h3"></h2>
      <div class="row grow">
        <div class="bigcol in">
          <div class="bignum"><b id="big">0–0</b><span data-t="bigUnit"></span></div>
          <p class="bigcap" data-t="bigCap"></p>
          <p class="est" data-t="est"></p>
        </div>
        <div class="cards">
          <div class="card in"><b id="n1">0</b><span data-t="n1c"></span></div>
          <div class="card in"><b id="n2">0</b><span data-t="n2c"></span></div>
        </div>
      </div>
    </section>

    <!-- 5 why -->
    <section class="slide s4" data-s="4">
      <p class="eyebrow in" data-t="e4"></p>
      <h2 class="in" data-t="h4"></h2>
      <div class="row grow center">
        <div id="loop" class="loop in"></div>
        <div class="col">
          <ul id="causes" class="causes"></ul>
          <p class="demand in" data-t="demand"></p>
        </div>
      </div>
    </section>

    <!-- 6 product: three steps -->
    <section class="slide s8" data-s="5">
      <p class="eyebrow in" data-t="e_what"></p>
      <h2 class="in" data-t="h_what"></h2>
      <div class="steps grow" id="steps"></div>
      <p class="foot-line in" data-t="what_foot"></p>
    </section>

    <!-- 7 product: four lights -->
    <section class="slide s9" data-s="6">
      <p class="eyebrow in" data-t="e_lights"></p>
      <h2 class="in" data-t="h_lights"></h2>
      <div class="lq grow" id="lq"></div>
      <p class="foot-line in" data-t="lights_foot"></p>
    </section>

    <!-- 8 product: how it works (architecture, plain) -->
    <section class="slide s10" data-s="7">
      <p class="eyebrow in" data-t="e_how"></p>
      <h2 class="in" data-t="h_how"></h2>
      <div class="arch grow" id="arch"></div>
      <p class="foot-line in shield"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg><span data-t="arch_foot"></span></p>
    </section>

    <!-- 9 product: live demo (telefon markazda, katta) -->
    <section class="slide s5" data-s="8">
      <div class="s5-head"><h2 class="in" data-t="h5"></h2><p class="nasa42 in"><b data-t="n42"></b><span data-t="n42sub"></span></p></div>
      <div class="demo-stage">
        <ul id="lightsL" class="lights side left"></ul>
        <div class="phone-wrap in"><div class="phone" id="phone"><i class="btn-action"></i><i class="btn-vol up"></i><i class="btn-vol down"></i><i class="btn-power"></i><i class="btn-camera"></i><div class="screen"><i class="island"></i><div class="statusbar"><span class="clock">9:41</span><span class="status"><svg class="sig" viewBox="0 0 20 12" aria-hidden="true"><rect x="0" y="8" width="3.6" height="4" rx="1"/><rect x="5.3" y="5.5" width="3.6" height="6.5" rx="1"/><rect x="10.6" y="3" width="3.6" height="9" rx="1"/><rect x="15.9" y="0" width="3.6" height="12" rx="1"/></svg><svg class="wifi" viewBox="0 0 18 13.6" aria-hidden="true" fill="currentColor"><path d="M0.81 5.06A11.20 11.20 0 0 1 17.19 5.06L15.87 6.29A9.40 9.40 0 0 0 2.13 6.29ZM3.37 7.45A7.70 7.70 0 0 1 14.63 7.45L13.31 8.68A5.90 5.90 0 0 0 4.69 8.68ZM5.93 9.84A4.20 4.20 0 0 1 12.07 9.84L10.90 10.93A2.60 2.60 0 0 0 7.10 10.93ZM9 10.9a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z"/></svg><svg class="bat" viewBox="0 0 28 13" aria-hidden="true"><rect x="0.75" y="0.75" width="23.5" height="11.5" rx="3.75" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/><rect x="2.5" y="2.5" width="20" height="8" rx="2.2" fill="currentColor"/><path d="M26 4.6v3.8c.9-.3 1.4-1 1.4-1.9S26.9 4.9 26 4.6z" fill="currentColor" fill-opacity=".35"/></svg></span></div><iframe id="app" title="Neyra app" allow="geolocation"></iframe><i class="home"></i></div></div></div>
        <ul id="lightsR" class="lights side right"></ul>
      </div>
      <div class="demo-foot">
        <p class="live in"><i></i><span data-t="demo_live"></span></p>
        <button id="resetDemo" class="ghost in" type="button" data-t="demo_reset"></button>
      </div>
    </section>

    <!-- 10 formulas: the four lights, the serious part -->
    <section class="slide s6" data-s="9">
      <p class="eyebrow in" data-t="e_f"></p>
      <h2 class="in" data-t="h_f"></h2>
      <div class="fx grow" id="fx"></div>
      <p class="foot-line in" data-t="f_foot"></p>
    </section>

    <!-- 11 team -->
    <section class="slide s7" data-s="10">
      <p class="eyebrow in" data-t="e7"></p>
      <h2 class="in" data-t="h7"></h2>
      <div class="row grow">
        <div class="team" id="team"></div>
        <div class="qrs" id="qrs"></div>
      </div>
      <p class="ai" data-t="ai"></p>
    </section>
  </main>

  <div class="ctl" id="ctl">
    <div class="bar"><i id="prog"></i></div>
    <div class="btns">
      <span id="count"></span>
      <button id="langBtn" type="button" aria-label="Language"></button>
      <button id="full" type="button" aria-label="Full screen">⛶</button>
    </div>
  </div>

  <script type="module" src="pitch.js?v=202611151650"></script>
</body>
</html>
