<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%232a78d6%27/%3E%3Cpath d=%27M7 23l6-10 5 6 7-10%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
  <title>Neyra</title>
  <meta name="description" content="Neyra — crop rotation options for a farmer's field from NASA Earth data (NASA Space Apps 2026, Field Shift challenge).">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
  <header class="top">
    <button id="back" class="link back" hidden>←</button>
    <img class="logo" src="../site/assets/neyra-64.png" alt="" width="26" height="26"><h1 id="title">Neyra</h1>
    <button id="lang" class="lang" aria-label="Til / Language">EN</button>
  </header>

  <section id="screen-field">
    <p id="intro" class="intro"></p>
    <h2 id="step1"></h2>
    <p id="mapHint" class="muted small"></p>
    <div id="layerBar" class="layerbar" role="group"></div>
    <div id="map" role="application"></div>
    <div id="timeBar" class="timebar" hidden>
      <button id="play" class="play" type="button">▶</button>
      <input id="frame" type="range" min="0" max="0" step="1" value="0">
      <span id="frameLabel" class="frame-label" aria-live="polite"></span>
    </div>
    <div id="legend" class="legend" hidden></div>
    <div class="row">
      <button id="btnLocate" class="secondary"></button>
      <button id="btnDemo" class="secondary"></button>
    </div>
    <p id="picked" class="picked" aria-live="polite"></p>
    <section id="readout" class="readout" hidden></section>
  </section>

  <main id="main" hidden></main>

  <div class="bottom"><button id="primary" class="primary" hidden></button></div>

  <script type="module" src="app.js"></script>
</body>
</html>
